name: Dependabot auto-merge

# When CI passed on a Dependabot pull request (the tests and an image build), merge it and build main.
# Runs as workflow_run, in the context of main: it never checks out the PR's code.
#
# GITHUB_TOKEN may not merge a change to a workflow file (the github-actions updates touch ci.yml).
# For those, store a fine-grained token as the repository secret AUTOMERGE_TOKEN (this repository only;
# Contents, Pull requests and Workflows: read and write). Without it those PRs stay open for a manual merge.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          OWN_TOKEN: ${{ secrets.AUTOMERGE_TOKEN != '' }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # only the open Dependabot PR of that branch, and only the commit CI tested
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,author,headRefOid \
                 --jq ".[] | select(.author.login == \"app/dependabot\" and .headRefOid == \"$SHA\") | .number")
          if [ -z "$pr" ]; then echo "No open Dependabot PR for $BRANCH at $SHA"; exit 0; fi
          # A PR that changes a workflow file and is behind main (another PR was merged first) cannot be merged
          # with GITHUB_TOKEN: the squash would write a new version of that file. It needs a rebase first, and
          # Dependabot only takes "@dependabot rebase" from a user with push access: so only with AUTOMERGE_TOKEN.
          # Every other PR (npm, pip, docker) is merged as it is, also when it is behind.
          behind=$(gh api "repos/$REPO/compare/main...$SHA" --jq .behind_by)
          workflows=$(gh pr diff "$pr" --repo "$REPO" --name-only | grep -c '^\.github/workflows/' || true)
          if [ "$behind" != "0" ] && [ "$workflows" != "0" ]; then
            if [ "$OWN_TOKEN" = "true" ]; then
              gh pr comment "$pr" --repo "$REPO" --body "@dependabot rebase"
              echo "::notice::PR #$pr changes a workflow file and is $behind commit(s) behind main; asked Dependabot to rebase it."
            else
              echo "::notice::PR #$pr changes a workflow file and is behind main: merge it by hand, comment '@dependabot rebase', or add the AUTOMERGE_TOKEN secret."
            fi
            exit 0
          fi
          if ! out=$(gh pr merge "$pr" --repo "$REPO" --squash --delete-branch --match-head-commit "$SHA" 2>&1); then
            echo "$out"
            if grep -q "workflows. permission" <<<"$out"; then
              echo "::notice::PR #$pr changes a workflow file; GITHUB_TOKEN may not merge that. Merge it by hand, or add the AUTOMERGE_TOKEN secret."
              exit 0
            fi
            if grep -q "merge conflicts" <<<"$out"; then
              echo "::notice::PR #$pr conflicts with main after another merge; Dependabot rebases it and CI runs again."
              exit 0
            fi
            exit 1
          fi
          # a merge with GITHUB_TOKEN does not start the push workflow: build main (and latest) explicitly.
          # With AUTOMERGE_TOKEN the merge is a normal push and starts CI itself.
          if [ "$OWN_TOKEN" != "true" ]; then gh workflow run ci.yml --repo "$REPO" --ref main; fi
